<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopList - Add Item</title>

<script src="js/theme.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',Arial,sans-serif;
}

body{
  max-width:400px;
  margin:0 auto;
  background:#f5f7fa;
  min-height:100vh;
  color:#222;
  transition:background-color .25s ease,color .25s ease;
}

/* =========================
   HEADER
========================= */

.header{
  background:#1E6FEB;
  color:white;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:14px;
}

.back-btn{
  background:none;
  border:none;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.header h1{
  font-size:20px;
  font-weight:bold;
}

/* =========================
   FORM
========================= */

.form{
  padding:16px;
}

/* =========================
   PHOTO BOX
========================= */

.photo-box{
  background:white;
  border-radius:14px;
  padding:20px;
  text-align:center;
  margin-bottom:14px;
  box-shadow:0 2px 6px rgba(0,0,0,0.06);
  border:2px dashed #c8dcf7;
  transition:
    background-color .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.photo-preview-area{
  width:100%;
}

.photo-box img{
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:10px;
  display:block;
}

.photo-icon{
  font-size:44px;
}

.photo-label{
  font-size:14px;
  color:#1E6FEB;
  font-weight:600;
  margin-top:8px;
}

.photo-hint{
  font-size:11px;
  color:#999;
  margin-top:4px;
}

/* =========================
   PHOTO BUTTONS
========================= */

.photo-buttons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.photo-btn{
  flex:1;
  padding:12px 8px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  border:none;
  transition:transform .15s ease,opacity .15s ease;
}

.photo-btn:active{
  transform:scale(.97);
}

.camera-btn{
  background:#1E6FEB;
  color:white;
}

.gallery-btn{
  background:#EAF3FF;
  color:#1E6FEB;
  border:1px solid #c8dcf7;
}

/* =========================
   CAMERA MODAL
========================= */

.camera-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.camera-modal.show{
  display:flex;
}

.camera-container{
  width:100%;
  max-width:380px;
  background:#111;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.camera-title{
  color:white;
  text-align:center;
  font-size:16px;
  font-weight:600;
  padding:14px;
  background:#1E1E1E;
}

#cameraVideo{
  width:100%;
  display:block;
  background:black;
  max-height:65vh;
  object-fit:cover;
}

/* CAMERA CONTROLS */

.camera-controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  padding:14px;
  background:#1E1E1E;
}

.camera-control-btn{
  width:100%;
  border:none;
  border-radius:25px;
  padding:13px 5px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
}

.take-photo-btn{
  background:#1E6FEB;
  color:white;
}

.switch-camera-btn{
  background:#444;
  color:white;
}

.cancel-camera-btn{
  background:#333;
  color:white;
}

/* =========================
   FORM FIELDS
========================= */

.field{
  margin-bottom:14px;
}

.field label{
  font-size:13px;
  font-weight:600;
  color:#555;
  display:block;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:13px;
  border:1.5px solid #ddd;
  border-radius:10px;
  font-size:15px;
  background:white;
  color:#222;
  transition:
    background-color .25s ease,
    color .25s ease,
    border-color .25s ease;
}

.field textarea{
  min-height:90px;
  resize:vertical;
  line-height:1.4;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  outline:none;
  border-color:#1E6FEB;
}

.field input::placeholder,
.field textarea::placeholder{
  color:#999;
}

/* =========================
   CATEGORY
========================= */

.category-icon{
  margin-right:4px;
}

/* =========================
   ROW
========================= */

.row{
  display:flex;
  gap:10px;
}

.row .field:first-child{
  flex:1.2;
}

.row .field:last-child{
  flex:1;
}

/* =========================
   PRE-BUDGET NOTE
========================= */

.prebudget-note{
  background:#EAF3FF;
  border-radius:10px;
  padding:10px 14px;
  font-size:12px;
  color:#1E6FEB;
  margin-bottom:16px;
  line-height:1.5;
  transition:
    background-color .25s ease,
    color .25s ease;
}

/* =========================
   SAVE BUTTON
========================= */

.save-btn{
  width:100%;
  padding:15px;
  background:#1E6FEB;
  color:white;
  border:none;
  border-radius:30px;
  font-size:16px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(30,111,235,0.3);
  margin-bottom:10px;
}

.save-btn:active{
  transform:scale(.98);
}

/* =========================
   DARK MODE
========================= */

body.dark-mode{
  background:#121212;
  color:#f5f5f5;
}

body.dark-mode .photo-box{
  background:#1e1e1e;
  border-color:#3d5575;
  box-shadow:0 2px 6px rgba(0,0,0,0.35);
}

body.dark-mode .photo-label{
  color:#6da5ff;
}

body.dark-mode .photo-hint{
  color:#888;
}

body.dark-mode .gallery-btn{
  background:#1b304d;
  color:#6da5ff;
  border-color:#3d5575;
}

body.dark-mode .field label{
  color:#ccc;
}

body.dark-mode .field input,
body.dark-mode .field select,
body.dark-mode .field textarea{
  background:#1e1e1e;
  color:#f5f5f5;
  border-color:#444;
}

body.dark-mode .field input::placeholder,
body.dark-mode .field textarea::placeholder{
  color:#888;
}

body.dark-mode .field select option{
  background:#1e1e1e;
  color:#f5f5f5;
}

body.dark-mode .prebudget-note{
  background:#1b304d;
  color:#6da5ff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:360px){

  .form{
    padding:12px;
  }

  .camera-control-btn{
    font-size:10px;
    padding:12px 3px;
  }

}
</style>

<base target="_blank">

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="header">

  <button
    class="back-btn"
    onclick="goBack()">
    ←
  </button>

  <h1>Add Item</h1>

</div>


<div class="form">

  <!-- =========================
       PHOTO
  ========================= -->

  <div class="photo-box">

    <div
      id="photoPreview"
      class="photo-preview-area">

      <div class="photo-icon">
        📷
      </div>

      <div class="photo-label">
        Add Item Photo
      </div>

      <div class="photo-hint">
        Take a photo or choose one from your gallery
      </div>

    </div>


    <div class="photo-buttons">

      <button
        type="button"
        class="photo-btn camera-btn"
        onclick="openCamera()">

        📷 Camera

      </button>


      <button
        type="button"
        class="photo-btn gallery-btn"
        onclick="openGallery()">

        🖼️ Gallery

      </button>

    </div>


    <!-- GALLERY INPUT -->

    <input
      type="file"
      id="galleryInput"
      accept="image/*"
      style="display:none">

  </div>


  <!-- =========================
       CAMERA MODAL
  ========================= -->

  <div
    id="cameraModal"
    class="camera-modal">

    <div class="camera-container">

      <div class="camera-title">
        📷 Take Item Photo
      </div>


      <video
        id="cameraVideo"
        autoplay
        playsinline
        muted>
      </video>


      <div class="camera-controls">

        <button
          type="button"
          class="camera-control-btn cancel-camera-btn"
          onclick="closeCamera()">

          CANCEL

        </button>


        <button
          type="button"
          class="camera-control-btn switch-camera-btn"
          onclick="switchCamera()">

          🔄 SWITCH

        </button>


        <button
          type="button"
          class="camera-control-btn take-photo-btn"
          onclick="takePhoto()">

          📸 TAKE PHOTO

        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       ITEM NAME
  ========================= -->

  <div class="field">

    <label>
      Item Name *
    </label>

    <input
      type="text"
      id="itemName"
      placeholder="e.g. Rice, Eggs, Milk"
      autocomplete="off">

  </div>


  <!-- =========================
       CATEGORY
  ========================= -->

  <div class="field">

    <label>
      Category *
    </label>

    <select id="itemCategory">

      <option value="General">
        🛒 General
      </option>

      <option value="Food">
        🍎 Food
      </option>

      <option value="Grocery">
        🛒 Grocery
      </option>

      <option value="Beverages">
        🥤 Beverages
      </option>

      <option value="Bakery">
        🍞 Bakery
      </option>

      <option value="Meat">
        🥩 Meat
      </option>

      <option value="Fruits & Vegetables">
        🥬 Fruits & Vegetables
      </option>

      <option value="Household">
        🏠 Household
      </option>

      <option value="Personal Care">
        🧴 Personal Care
      </option>

      <option value="School">
        📚 School
      </option>

      <option value="Other">
        📦 Other
      </option>

    </select>

  </div>


  <!-- =========================
       QUANTITY + UNIT
  ========================= -->

  <div class="row">

    <div class="field">

      <label>
        Quantity *
      </label>

      <input
        type="number"
        id="itemQty"
        placeholder="e.g. 2"
        min="1"
        step="1">

    </div>


    <div class="field">

      <label>
        Unit
      </label>

      <select id="itemUnit">

        <option value="pcs">
          pcs
        </option>

        <option value="kg">
          kg
        </option>

        <option value="liter">
          liter
        </option>

        <option value="pack">
          pack
        </option>

        <option value="loaf">
          loaf
        </option>

        <option value="box">
          box
        </option>

        <option value="bottle">
          bottle
        </option>

        <option value="can">
          can
        </option>

      </select>

    </div>

  </div>


  <!-- =========================
       PRE-BUDGET
  ========================= -->

  <div class="field">

    <label>
      Pre-Budget Amount (₱) *
    </label>

    <input
      type="number"
      id="itemPreBudget"
      placeholder="How much you plan to spend"
      min="0"
      step="0.01">

  </div>


  <!-- =========================
       NOTE
  ========================= -->

  <div class="field">

    <label>
      Note (Optional)
    </label>

    <textarea
      id="itemNote"
      placeholder="Add a note about this item..."></textarea>

  </div>


  <!-- =========================
       INFORMATION
  ========================= -->

  <div class="prebudget-note">

    💡 <b>Pre-budgeting lang muna!</b><br>

    Ang actual expenditure ay ilalagay kapag nabili mo na ang item.

  </div>


  <!-- =========================
       SAVE
  ========================= -->

  <button
    class="save-btn"
    onclick="saveItem()">

    SAVE ITEM

  </button>

</div>


<script>

/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
  'shoplist_items';


let capturedPhoto = null;

let cameraStream = null;

let usingFrontCamera = false;


/* =========================
   DARK MODE
========================= */

function applySavedTheme(){

  try{

    if(typeof isDarkMode === "function"){

      document.body.classList.toggle(
        "dark-mode",
        isDarkMode()
      );

    }

  }catch(error){

    console.log(
      "Theme check error:",
      error
    );

  }

}

applySavedTheme();


/* =========================
   OPEN CAMERA
========================= */

async function openCamera(){

  const modal =
    document.getElementById(
      'cameraModal'
    );


  const video =
    document.getElementById(
      'cameraVideo'
    );


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Camera is not supported by this browser. Please use Gallery instead."
    );

    return;

  }


  try{

    stopCamera();


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:
              usingFrontCamera
                ? "user"
                : "environment"
          }
        },

        audio:false

      });


    video.srcObject =
      cameraStream;


    modal.classList.add(
      'show'
    );


    await video.play();


  }catch(error){

    console.error(error);


    if(
      error.name ===
      "NotAllowedError"
    ){

      alert(
        "Camera permission was denied. Please allow camera access in your browser settings."
      );

    }

    else if(
      error.name ===
      "NotFoundError"
    ){

      alert(
        "No camera was found on this device."
      );

    }

    else{

      alert(
        "Unable to open the camera. Please try again or use Gallery."
      );

    }

  }

}


/* =========================
   SWITCH CAMERA
========================= */

async function switchCamera(){

  if(!cameraStream){

    return;

  }


  const video =
    document.getElementById(
      'cameraVideo'
    );


  usingFrontCamera =
    !usingFrontCamera;


  try{

    stopCamera();


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            exact:
              usingFrontCamera
                ? "user"
                : "environment"
          }
        },

        audio:false

      });


    video.srcObject =
      cameraStream;


    await video.play();


  }catch(error){

    console.error(error);


    /*
      Fallback for devices that don't
      support exact facingMode.
    */

    try{

      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            facingMode:{
              ideal:
                usingFrontCamera
                  ? "user"
                  : "environment"
            }
          },

          audio:false

        });


      video.srcObject =
        cameraStream;


      await video.play();


    }catch(secondError){

      console.error(
        secondError
      );


      usingFrontCamera =
        !usingFrontCamera;


      alert(
        "Unable to switch camera on this device."
      );

    }

  }

}


/* =========================
   TAKE PHOTO
========================= */

function takePhoto(){

  const video =
    document.getElementById(
      'cameraVideo'
    );


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    alert(
      "Camera is not ready yet."
    );

    return;

  }


  const canvas =
    document.createElement(
      'canvas'
    );


  const maxSize = 400;


  let width =
    video.videoWidth;

  let height =
    video.videoHeight;


  if(width > height){

    if(width > maxSize){

      height *=
        maxSize / width;

      width =
        maxSize;

    }

  }else{

    if(height > maxSize){

      width *=
        maxSize / height;

      height =
        maxSize;

    }

  }


  canvas.width =
    Math.round(width);

  canvas.height =
    Math.round(height);


  const ctx =
    canvas.getContext(
      '2d'
    );


  /*
    Mirror front camera photo
    to make it look natural.
  */

  if(usingFrontCamera){

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(
      -1,
      1
    );

  }


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  capturedPhoto =
    canvas.toDataURL(
      'image/jpeg',
      0.7
    );


  stopCamera();


  document
    .getElementById(
      'cameraModal'
    )
    .classList.remove(
      'show'
    );


  showPhotoPreview();

}


/* =========================
   CLOSE CAMERA
========================= */

function closeCamera(){

  stopCamera();


  document
    .getElementById(
      'cameraModal'
    )
    .classList.remove(
      'show'
    );

}


/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );


    cameraStream =
      null;

  }


  const video =
    document.getElementById(
      'cameraVideo'
    );


  if(video){

    video.srcObject =
      null;

  }

}


/* =========================
   OPEN GALLERY
========================= */

function openGallery(){

  const gallery =
    document.getElementById(
      'galleryInput'
    );


  gallery.value =
    '';


  gallery.click();

}


/* =========================
   GALLERY INPUT
========================= */

document
  .getElementById(
    'galleryInput'
  )
  .addEventListener(
    'change',
    function(event){

      const file =
        event.target.files[0];


      if(!file){

        return;

      }


      if(
        !file.type ||
        !file.type.startsWith(
          'image/'
        )
      ){

        alert(
          "Please select an image."
        );

        return;

      }


      processPhoto(file);

    }
  );


/* =========================
   PROCESS PHOTO
========================= */

function processPhoto(file){

  const reader =
    new FileReader();


  reader.onload =
    function(event){

      const img =
        new Image();


      img.onload =
        function(){

          const canvas =
            document.createElement(
              'canvas'
            );


          const maxSize =
            400;


          let width =
            img.width;

          let height =
            img.height;


          if(width > height){

            if(width > maxSize){

              height *=
                maxSize / width;

              width =
                maxSize;

            }

          }else{

            if(height > maxSize){

              width *=
                maxSize / height;

              height =
                maxSize;

            }

          }


          canvas.width =
            Math.round(width);

          canvas.height =
            Math.round(height);


          const ctx =
            canvas.getContext(
              '2d'
            );


          ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );


          capturedPhoto =
            canvas.toDataURL(
              'image/jpeg',
              0.7
            );


          showPhotoPreview();

        };


      img.src =
        event.target.result;

    };


  reader.readAsDataURL(file);

}


/* =========================
   PHOTO PREVIEW
========================= */

function showPhotoPreview(){

  document
    .getElementById(
      'photoPreview'
    )
    .innerHTML = `

      <img
        src="${capturedPhoto}"
        alt="Item Photo">

      <div class="photo-label">
        Photo selected ✓
      </div>

  `;

}


/* =========================
   SAVE ITEM
========================= */

function saveItem(){

  const name =
    document
      .getElementById(
        'itemName'
      )
      .value
      .trim();


  const category =
    document
      .getElementById(
        'itemCategory'
      )
      .value;


  const qty =
    document
      .getElementById(
        'itemQty'
      )
      .value;


  const unit =
    document
      .getElementById(
        'itemUnit'
      )
      .value;


  const preBudget =
    document
      .getElementById(
        'itemPreBudget'
      )
      .value;


  const note =
    document
      .getElementById(
        'itemNote'
      )
      .value
      .trim();


  /* VALIDATION */

  if(!name){

    alert(
      'Please enter the item name.'
    );

    return;

  }


  if(
    !qty ||
    Number(qty) <= 0
  ){

    alert(
      'Please enter a valid quantity.'
    );

    return;

  }


  if(
    preBudget === '' ||
    Number(preBudget) < 0
  ){

    alert(
      'Please enter the pre-budget amount.'
    );

    return;

  }


  /*
    GET EXISTING ITEMS
  */

  const items =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || '[]'
    );


  /*
    CREATE NEW ITEM
  */

  const newItem = {

    id:Date.now(),

    name:name,

    category:
      category || 'General',

    qty:Number(qty),

    unit:unit,

    preBudget:
      Number(preBudget),

    actualSpent:null,

    note:note,

    photo:
      capturedPhoto,

    status:'pending',

    createdAt:
      new Date().toISOString()

  };


  items.push(
    newItem
  );


  /*
    SAVE
  */

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(items)
  );


  /*
    SAVE SELECTED ITEM ID
    so Item Details can open it.
  */

  localStorage.setItem(
    'selected_item_id',
    String(newItem.id)
  );


  alert(
    'Item saved! ✅'
  );


  /*
    GO TO HOME
  */

  window.location.href =
    'home.html';

}


/* =========================
   GO BACK
========================= */

function goBack(){

  stopCamera();


  window.location.href =
    'home.html';

}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  'beforeunload',
  function(){

    stopCamera();

  }
);

</script>

</body>
</html>
